name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # One job, not a matrix entry: `eslint.config.mjs` is a single flat config
  # at the root that covers every package, so linting per-package would run
  # the same config eleven times.
  #
  # No build step. Nothing here is type-aware — the config sets no
  # `tsconfigPath`, so every enabled rule is syntactic and does not need
  # sibling packages' dist/ to exist.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # data-access + device were absent until 2026-08-04; their only
        # automated check was inside publish.yml at tag time, so a break
        # would not surface until someone cut a release.
        package: [types, core, auth, ui, ai, db, theme, collab, analytics, data-access, device]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        # Packages resolve each other through their `exports` maps, which
        # point at dist/. On a clean checkout dist/ does not exist yet, so a
        # package that imports a sibling (analytics -> types/device-events)
        # fails to typecheck. `^...` builds dependencies only, not the
        # package itself — that is still the job's own Build step.
        run: pnpm --filter @mongrov/${{ matrix.package }}^... run build

      - name: Typecheck
        run: pnpm --filter @mongrov/${{ matrix.package }} run typecheck

      - name: Test
        run: pnpm --filter @mongrov/${{ matrix.package }} run test

      - name: Build
        run: pnpm --filter @mongrov/${{ matrix.package }} run build

  # Publish safety — the class of break the matrix above CANNOT catch.
  #
  # In this workspace every @mongrov/* dependency is a symlink to local
  # source, so `@mongrov/types/kv-keys` always resolves and every job is
  # green. It did not resolve for anyone installing from npm:
  # analytics@0.8.0 shipped importing a subpath that published types@0.5.0
  # never had, because the export was added 4h44m after 0.5.0 was published
  # with no version bump. QA found it in Metro; CI could not have.
  #
  # Needs the registry, so it is its own job — a network blip must not sink
  # the unit matrix.
  publish-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Checks read built output, so everything must be built first.
      - name: Build all packages
        run: pnpm -r run build

      - name: Check published drift + subpath resolvability
        run: node scripts/check-published-drift.mjs

  # Live-warehouse integration suite for @mongrov/analytics — boots a
  # MinIO + Iceberg REST stack via docker-compose and exercises the real
  # attach/push/fetch flow against it. Isolated from the fast unit matrix
  # so a docker outage doesn't sink every other package.
  analytics-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Boot analytics stack
        working-directory: packages/analytics/infra/analytics-minio
        run: docker compose up -d --wait

      - name: Integration tests
        env:
          INTEGRATION_STACK_EXTERNAL: '1'
        run: pnpm --filter @mongrov/analytics run test:integration

      - name: Dump compose logs on failure
        if: failure()
        working-directory: packages/analytics/infra/analytics-minio
        run: docker compose logs

      - name: Teardown
        if: always()
        working-directory: packages/analytics/infra/analytics-minio
        run: docker compose down -v
