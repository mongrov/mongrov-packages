# Ziva brand default rules.
#
# Copied verbatim into `ziva.ts` as an inline template string. Do NOT edit
# the wrapper file directly — treat this .toml as the source of truth.
#
# Rules cover the core Ziva health surface: HRV drop, sleep deprivation,
# elevated stress, and low weekly activity. Verbatim from
# `.specifica/features/analytics-rules/spec.md` §Brand defaults.
#
# Two of these deliberately use relative targets rather than absolutes:
# `baseline_percent` (HRV) and `baseline_stddev` (stress). A fixed HRV
# threshold is meaningless across users — 30 ms is alarming for one person
# and unremarkable for another — so the shipped catalog exercises the
# compiler's baseline paths, not just the absolute path.

[[rule]]
id = "ziva.hrv-drop-30"
brand = "ziva"
name = "Sudden HRV drop"
description = "HRV dropped 30% below 7-day baseline"
metric = "hrv_ms"
window = "24h"
aggregation = "avg"
compare = "less_than"
severity = "warn"

[rule.target]
type = "baseline_percent"
windowDays = 7
percent = 70

[rule.throttle]
minGapMinutes = 720
maxPerDay = 1

[[rule]]
id = "ziva.sleep-deprivation-3"
brand = "ziva"
name = "Three nights short sleep"
description = "Average nightly sleep across 3 nights below 300 minutes."
metric = "sleep_total_minutes"
window = "3d"
aggregation = "avg"
compare = "less_than"
severity = "info"

[rule.target]
type = "absolute"
value = 300

[rule.throttle]
minGapMinutes = 1440
maxPerDay = 1

# ziva.stress-elevated-day was RETIRED 2026-08-19.
#
# It fired on a single day's average 1.5 stddev above a 14-day baseline. D-E
# replaced that with ziva.stress-tense-days — +10 over the 30-day p50, held for
# two consecutive days — choosing persistence over a single-day trigger on
# purpose. Keeping both meant two near-identical "above your usual" notices on
# day 2 of a tense stretch, which is the fatigue throttles exist to prevent.
#
# Its throttle keys (analytics:rule:ziva.stress-elevated-day:{userId}:*) are
# left in place. Nothing reads them once the rule is unregistered, so they are
# inert; a cleanup sweep can ride a future migration rather than being its own
# risk today.

[[rule]]
id = "ziva.low-activity-week"
brand = "ziva"
name = "Low activity all week"
description = "Total steps across the last 7 days below 20,000."
metric = "activity_steps"
window = "7d"
aggregation = "sum"
compare = "less_than"
severity = "info"
# QA #108: a week's sum over a ring worn one day is the wear, not the user.
# 6 of 7 local days allows one charging day; a newly paired ring stays quiet.
minDays = 6

[rule.target]
type = "absolute"
value = 20000

[rule.throttle]
minGapMinutes = 10080
maxPerDay = 1

# ─────────────────────────────────────────────────────────────────────────
# SpO₂ — two rules that coexist deliberately (Sprint 5 §4, Ziva #1).
#
# A is the LOUD one: the alert the user configured in the ⚙ sheet, firing
# on a single reading below their own safe level, day or night.
# B is a SECONDARY pattern insight: a sustained nightly dip, which is a
# different observation and belongs in the feed rather than as an alert.
# They fire independently and hold independent throttle state.
# ─────────────────────────────────────────────────────────────────────────

[[rule]]
id = "ziva.spo2-safe-level"
brand = "ziva"
name = "SpO₂ below your safe level"
description = "Alerts on any single reading below your configured safe level"
metric = "spo2"
# 24h, NOT 1h. Rules evaluate at batch:complete, and a morning sync
# delivers ~8 hours of overnight readings in one batch. A wall-clock 1h
# window would silently miss anything older than an hour before eval —
# including the exact overnight crossings the "day or night" promise
# exists for. 24h covers the batch delivery envelope; the throttle below
# prevents duplicate fires from re-scanned data.
window = "24h"
aggregation = "min"
compare = "less_than"
context = "any"
consecutive = 1
severity = "warn"

[rule.target]
type = "user_setting"
key = "user:spo2SafeLevel"
defaultValue = 90

[rule.throttle]
minGapMinutes = 60
maxPerDay = 3

[[rule]]
id = "ziva.spo2-desaturation-asleep"
brand = "ziva"
name = "Nightly low SpO₂ pattern"
description = "Pattern of low SpO₂ during sleep — 3 consecutive samples below 88"
metric = "spo2"
window = "24h"
aggregation = "min"
compare = "less_than"
context = "asleep"
consecutive = 3
severity = "info"

[rule.target]
type = "absolute"
value = 88

[rule.throttle]
minGapMinutes = 720
maxPerDay = 1

# ── sprint6: temperature ─────────────────────────────────────────────────
#
# Mirrors ziva.spo2-safe-level with the direction flipped. Canonical °C, and
# fractional on purpose: temp_c is DECIMAL(4,1) as of analytics 0.9.1
# precisely so the 37.2–38.1 range this setting offers discriminates. Against
# the old INTEGER column every value in that range selected the same rows.
[[rule]]
id = "ziva.temp-flag-level"
brand = "ziva"
name = "Running warm"
description = "Temperature at or above the level you set, for the nights you set."
metric = "temp_c"
# 30d, NOT 24h. At day cadence the window is how far back COMPLETED days are
# read, and today is excluded — a 24h window held at most one partial day, so
# "2 nights in a row" could never be observed and this rule never fired
# (zivaone_app#55, found by ziva-defaults-live.test.ts). It must cover the
# stepper's longest run (5) plus today; the validator now enforces that.
window = "30d"
aggregation = "max"
compare = "greater_than"
context = "any"
severity = "warn"
# T-23 — the sheet's consecutive-nights stepper, 1-5, default 2.
#
# `consecutiveKey` binds the count to the KV setting at EVAL time, exactly as
# ziva.hrv-below-usual binds user:hrvDropDays. A compile-time constant would
# mean the stepper moved a number the rule never read.
#
# Day cadence: "nights in a row", not readings in a row. At day cadence a day
# with no usable data BREAKS the run rather than closing it (min-data floor
# ruling), so a week away does not silently accumulate toward a flag.
cadence = "day"
consecutive = 2
consecutiveKey = "user:tempNights"

[rule.target]
type = "user_setting"
key = "user:tempFlagLevel"
defaultValue = 37.5

[rule.throttle]
minGapMinutes = 60
maxPerDay = 3

# Relative secondary insight: warm compared to YOUR usual, not to a number.
# Two days rather than one — a single warm day is weather, a mattress, or a
# late workout.
[[rule]]
id = "ziva.temp-warm-days"
brand = "ziva"
name = "Warmer than usual"
description = "Daily average ran above your usual range two days running."
metric = "temp_c"
window = "30d"
aggregation = "avg"
compare = "greater_than"
cadence = "day"
consecutive = 2
severity = "info"

[rule.target]
type = "baseline_offset"
windowDays = 30
offset = 0.3
direction = "above"

[rule.throttle]
minGapMinutes = 1440
maxPerDay = 1

# ── sprint6: HRV ─────────────────────────────────────────────────────────
#
# HRV's ONLY rule, and relative-only by locked decision D3. There is no
# meaningful absolute HRV threshold: 30 ms is alarming for one person and
# unremarkable for another. Every generation of the HRV screen so far has
# tried to add an absolute flag anyway, which is why the validator now
# rejects one rather than a reviewer having to catch it.
#
# Both the drop and the day count are user-settable (user:hrvDropMs,
# user:hrvDropDays) — the same KVStore mechanism the SpO₂ safe level uses.
[[rule]]
id = "ziva.hrv-below-usual"
brand = "ziva"
name = "HRV below your usual"
description = "Daily average HRV ran below your usual range for several days."
metric = "hrv_ms"
window = "30d"
aggregation = "avg"
compare = "less_than"
cadence = "day"
consecutive = 3
consecutiveKey = "user:hrvDropDays"
severity = "info"

[rule.target]
type = "baseline_offset"
windowDays = 30
offset = 10
direction = "below"
offsetKey = "user:hrvDropMs"

[rule.throttle]
minGapMinutes = 1440
maxPerDay = 1

# ── Stress (D-E, 2026-08-19) ────────────────────────────────────────────────
#
# Stress gets an ABSOLUTE draggable flag where HRV cannot. The difference is
# not inconsistency: HRV's absolute value means nothing across people, while
# stress is a vendor-normalised 0-100 score whose rails the user already sees
# in the ? sheet, so a flag at the Tense rail is truthful.
#
# Persistence, not a single spike. `consecutive: 3` at hourly cadence is about
# three hours above the flag, and since 0.16.0 those three must be ADJACENT on
# the cadence grid — a missed reading breaks the run rather than closing it.

[[rule]]
id = "ziva.stress-flag-level"
brand = "ziva"
name = "Stress stayed high"
description = "Stress at or above your flag level for three consecutive readings."
metric = "stress"
window = "24h"
aggregation = "avg"
compare = "greater_than_or_equal"
consecutive = 3
severity = "warn"

[rule.target]
type = "user_setting"
key = "user:stressFlagLevel"
defaultValue = 66

[rule.throttle]
minGapMinutes = 60
maxPerDay = 3

# Secondary, same shape as ziva.temp-warm-days: a multi-day drift above the
# user's OWN usual, which the absolute flag cannot express.
[[rule]]
id = "ziva.stress-tense-days"
brand = "ziva"
name = "Tenser than your usual"
description = "Daily average stress above your usual by 10 for two consecutive days."
metric = "stress"
window = "30d"
aggregation = "avg"
compare = "greater_than"
cadence = "day"
consecutive = 2
severity = "info"

[rule.target]
type = "baseline_offset"
windowDays = 30
offset = 10
direction = "above"

[rule.throttle]
minGapMinutes = 1440
maxPerDay = 1

# ── Heart rate (ruling D-H, 2026-08-21; zivaone_app T-26) ─────────────────
#
# One two-sided rule against the user's own SLEEPING band. It replaces
# ziva.hr-flag-level (a resting flag line, high only, user:hrFlagLevel), which
# D-H retired: a threshold that means one thing asleep and another mid-walk
# cannot exist, and one fixed low line would fire every night for a fit
# person who sleeps at 45.
#
# Asleep only — the phase that "changes first and you can't feel it" (§7l).
# ABOVE or BELOW the band counts; the verdict vocabulary stays the shipped
# pair because "high" is the finding, but a night well below the user's own
# range is as much a change as one above it.
#
# The band is the stored hr_asleep_lo/_hi rails (p50, the 90-day window the
# screen reads). While either is missing it is the population rails 48-62:
# D-H keeps the rule running on honest defaults while the band is learned.
# user:hrSensitivity scales the half-width about the midpoint exactly as the
# screen's band does: gentle 1.35, normal 1.0, watchful 0.7.
#
# consecutive = 3 at the 10-minute HR cadence is about half an hour asleep
# outside the band, slot-adjacent, so a gap breaks the run.

[[rule]]
id = "ziva.hr-out-of-band"
brand = "ziva"
name = "Sleeping heart rate outside your range"
description = "Three readings in a row while asleep sat outside your usual sleeping range."
metric = "hr_bpm"
window = "24h"
aggregation = "avg"
compare = "between"
context = "asleep"
consecutive = 3
severity = "warn"

[rule.target]
type = "phase_band"
band = "hr_asleep"
windowDays = 90
defaultLo = 48
defaultHi = 62
scaleKey = "user:hrSensitivity"
defaultScale = "normal"

[rule.target.scales]
gentle = 1.35
normal = 1.0
watchful = 0.7

[rule.throttle]
minGapMinutes = 60
maxPerDay = 3

# ── Ring battery ──────────────────────────────────────────────────────────
#
# These two moved here from `use-battery-notification.ts` in the app, which
# hard-coded 10 / 20 / 30 (zivaone_app#248). The threshold is content, not
# code, and belongs in the catalog with every other one.
#
# The app's THIRD tier — under 30% after 18:00, "charge overnight so your
# sleep data records fully" — deliberately stays in the app. `context` is
# `any | asleep | resting` and there is no time-of-day predicate, so this
# schema cannot express "only in the evening". Splitting by what the schema
# can say keeps each threshold with exactly one home, rather than moving a
# rule here and quietly dropping the condition that made it useful.
#
# `aggregation = "last"` and not `min`: battery is a level, not a
# measurement to average or a trough to find. The question is what the ring
# reports NOW, and a `min` over the window would keep firing off a reading
# from before the user charged it.

[[rule]]
id = "ziva.battery-low"
brand = "ziva"
name = "Ring battery low"
description = "Ring battery below 20% in the past hour."
metric = "device_battery"
window = "1h"
aggregation = "last"
compare = "less_than"
severity = "warn"

[rule.target]
type = "absolute"
value = 20

# 4 hours between alerts, matching the gap the app hook enforced via MMKV.
# `maxPerDay` is a backstop, not the binding constraint — the gap already
# caps this at six.
[rule.throttle]
minGapMinutes = 240
maxPerDay = 6

[[rule]]
id = "ziva.battery-critical"
brand = "ziva"
name = "Ring battery critical"
description = "Ring battery below 10% — readings will stop when it dies."
metric = "device_battery"
window = "1h"
aggregation = "last"
compare = "less_than"
severity = "critical"

[rule.target]
type = "absolute"
value = 10

# 30 minutes, as the app hook's urgent tier used. Capped per day so a ring
# that sits at 9% while charging cannot produce 48 notifications.
[rule.throttle]
minGapMinutes = 30
maxPerDay = 8
